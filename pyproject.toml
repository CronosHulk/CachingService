[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "caching-service"
version = "0.1.0"
description = "FastAPI caching service backed by PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.9,<1",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["caching_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["caching_service"]
